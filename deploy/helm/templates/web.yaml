apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: "{{ .Release.Namespace }}"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: parenthese-web
  template:
    metadata:
      labels:
        app: parenthese-web
    spec:
      containers:
        - name: web
          image: "{{ .Values.database.image.name }}:{{ .Values.database.image.tag }}"
          ports:
            - containerPort: 80
