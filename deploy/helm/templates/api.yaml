---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: "{{ .Release.Namespace }}"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: parenthese-api
  template:
    metadata:
      labels:
        app: parenthese-api
    spec:
      containers:
        - name: api
          image: "{{ .Values.api.image.name }}:{{ .Values.api.image.tag }}"
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: "{{ .Values.database.secret.name }}"
                  key: "{{ .Values.database.secret.userKey }}"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: "{{ .Values.database.secret.name }}"
                  key: "{{ .Values.database.secret.passwordKey }}"
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: "{{ .Values.database.secret.name }}"
                  key: "{{ .Values.database.secret.databaseKey }}"
            - name: DATABASE_URL
              value: postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@{{ .Values.api.dbUrl }}:5432/$(POSTGRES_DB)

            # {{- if .Values.api.auth.oidc.enabled }}
            - name: OIDC_ISSUER
              valueFrom:
                secretKeyRef:
                  name: "{{ .Values.api.auth.oidc.secret.name }}"
                  key: "{{ .Values.api.auth.oidc.secret.issuerKey }}"
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: "{{ .Values.api.auth.oidc.secret.name }}"
                  key: "{{ .Values.api.auth.oidc.secret.idKey }}"
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: "{{ .Values.api.auth.oidc.secret.name }}"
                  key: "{{ .Values.api.auth.oidc.secret.secretKey }}"
            - name: OIDC_REDIRECT_URI
              valueFrom:
                secretKeyRef:
                  name: "{{ .Values.api.auth.oidc.secret.name }}"
                  key: "{{ .Values.api.auth.oidc.secret.redirectKey }}"
            - name: OIDC_PROVIDER_NAME
              valueFrom:
                secretKeyRef:
                  name: "{{ .Values.api.auth.oidc.secret.name }}"
                  key: "{{ .Values.api.auth.oidc.secret.nameKey }}"
            - name: OIDC_REQUIRE_VERIFIED_EMAIL
              value: "{{ .Values.api.auth.oidc.requireVerifiedEmail }}"
            # {{- end }}

            - name: PASSWORD_LOGIN
              value: "{{ .Values.api.auth.allowPasswords }}"

            - name: NODE_ENV
              value: production
            - name: PORT
              value: "4000"
            - name: MEDIA_STORAGE_PATH
              value: /app/storage/media

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: "{{ .Values.api.jwt.secret.name }}"
                  key: "{{ .Values.api.jwt.secret.secretKey }}"
          volumeMounts:
            - name: data
              mountPath: /app/storage/media
              readOnly: false
          ports:
            - containerPort: 4000
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: "{{ .Values.api.volumeClaim.name }}"
