---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: "{{ .Release.Namespace }}"
spec:
  selector:
    app: parenthese-db
  ports:
    - protocol: TCP
      port: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: "{{ .Release.Namespace }}"
spec:
  selector:
    app: parenthese-api
  ports:
    - protocol: TCP
      port: 4000
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: "{{ .Release.Namespace }}"
spec:
  selector:
    app: parenthese-web
  ports:
    - protocol: TCP
      port: 80
